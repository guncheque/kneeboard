name: Build Windows

on:
  push:
    tags: ["v*"]        # tag a release (git tag v0.2.0 && git push --tags) to publish a zip
  workflow_dispatch:    # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Smoke test
        shell: pwsh
        run: |
          dist\kneeboard\kneeboard.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\kneeboard -DestinationPath kneeboard-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kneeboard-windows
          path: kneeboard-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: kneeboard-windows.zip
